name: Update Resume PDF in Hugo Site

on:
  repository_dispatch:
    types: [pdf_update] # Triggered by an external event from your resume repo
  workflow_dispatch: # Allows manual triggering from the Actions tab for testing

jobs:
  update_resume_in_hugo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Hugo Source Repository
        uses: actions/checkout@v4
        with:
          ref: main # IMPORTANT: Change 'main' if your Hugo dev branch is different (e.g., master)

      - name: Download Latest Resume PDF
        run: |
          curl -L -o static/resume.pdf https://raw.githubusercontent.com/gavintranquilino/gavins-resume/main/out/Gavin_Tranquilino.pdf
          echo "Downloaded resume.pdf to static/resume.pdf"
          ls -la static/resume.pdf # Optional: lists the file to verify

      - name: Commit and Push Updated PDF to Hugo Source
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Sync with remote to avoid non-fast-forward push failures.
          # --autostash handles the downloaded local PDF change during rebase.
          git pull --rebase --autostash origin main
          
          # Check if resume.pdf is modified or staged
          if git status --porcelain | grep -q 'static/resume.pdf'; then
            git add static/resume.pdf
            git commit -m "Update resume.pdf from gavins-resume repository"
            git push origin main
            echo "Committed and pushed updated resume.pdf"
          else
            echo "No changes to resume.pdf. Skipping commit."
          fi

      - name: Checkout GitHub Pages Repository
        uses: actions/checkout@v4
        with:
          repository: gavintranquilino/gavintranquilino.github.io
          token: ${{ secrets.GH_PAT_FOR_DEPLOY }}
          ref: master
          path: gh-pages-repo

      - name: Copy Resume PDF into GitHub Pages Repository
        run: |
          cp static/resume.pdf gh-pages-repo/resume.pdf
          ls -la gh-pages-repo/resume.pdf

      - name: Commit and Push Updated PDF to GitHub Pages Repository
        working-directory: gh-pages-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git status --porcelain | grep -q 'resume.pdf'; then
            git add resume.pdf
            git commit -m "Update resume.pdf from gavins-resume repository"
            git push origin master
            echo "Committed and pushed updated resume.pdf to GitHub Pages repo"
          else
            echo "No changes to resume.pdf in GitHub Pages repo. Skipping commit."
          fi
